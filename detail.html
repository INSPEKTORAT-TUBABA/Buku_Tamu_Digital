<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Detail Tamu — Buku Tamu Digital Inspektorat Tubaba</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e8f4fd; margin: 0; padding: 0; }
        body::before {
            content: ''; position: fixed; inset: 0;
            border: 10px solid transparent;
            border-image: linear-gradient(135deg,#f5e07a 0%,#d4a820 20%,#a07810 40%,#f5e07a 55%,#d4a820 70%,#c8960e 85%,#f5e07a 100%) 1;
            box-shadow: inset 0 0 18px 4px rgba(212,168,32,.55), inset 0 0 6px 1px rgba(0,0,0,.55), 0 0 22px 6px rgba(212,168,32,.30);
            pointer-events: none; z-index: 99999;
        }
        body::after {
            content: ''; position: fixed; inset: 16px;
            border: 1.5px solid rgba(212,168,32,.40);
            pointer-events: none; z-index: 99998;
        }
        .wrapper { max-width: 700px; margin: 28px auto 40px; padding: 0 18px; }
        .detail-header {
            background: linear-gradient(135deg,#0d1f45 0%,#1a3a6e 60%,#0d1f45 100%);
            color: #f5e07a; padding: 22px 20px 18px; text-align: center; border-radius: 10px 10px 0 0;
        }
        .detail-header h1 { margin:0; font-size:1.25em; letter-spacing:.08em; text-transform:uppercase; }
        .detail-header p { margin:4px 0 0; font-size:.82em; color:rgba(255,255,255,.75); }
        .detail-header .ts { margin-top:8px; font-size:.75em; color:rgba(245,224,122,.75); }
        .detail-body { background:#fff; border:1px solid rgba(212,168,32,.25); border-top:none; }
        .detail-row { display:flex; padding:11px 18px; border-bottom:1px solid #f0ead8; align-items:flex-start; gap:10px; }
        .detail-row:last-child { border-bottom:none; }
        .detail-row:nth-child(even) { background:#fafaf7; }
        .detail-label { font-weight:700; color:#0d1f45; min-width:148px; font-size:.88em; }
        .detail-value { color:#333; font-size:.9em; flex:1; word-break:break-word; }
        a.detail-value { color:#1a6e2a; }
        .foto-header {
            background: linear-gradient(135deg,#0d1f45 0%,#1a3a6e 60%,#0d1f45 100%);
            color:#f5e07a; padding:11px 18px; font-weight:800; font-size:.92em;
            letter-spacing:.06em; margin-top:12px;
        }
        .foto-body { background:#fffef8; border:1px solid rgba(212,168,32,.25); border-top:none; padding:18px; }
        .foto-grid { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; margin-bottom:18px; }
        .foto-box { text-align:center; }
        .foto-box small { display:block; font-size:.74em; color:#666; margin-bottom:6px; font-weight:600; }
        .foto-box img { max-width:200px; max-height:200px; object-fit:cover; border:2px solid rgba(212,168,32,.45); border-radius:8px; display:block; }
        .ttd-box { text-align:center; margin-top:10px; }
        .ttd-box small { display:block; font-size:.74em; color:#666; margin-bottom:6px; font-weight:600; }
        .ttd-box img { max-width:320px; max-height:130px; object-fit:contain; border:2px solid rgba(212,168,32,.45); border-radius:6px; background:#fff; }
        .foto-empty { background:#f8f8f4; border:2px dashed rgba(212,168,32,.4); border-radius:8px; padding:28px 20px; color:#aaa; font-size:.88em; text-align:center; font-style:italic; margin:6px 0; }
        .detail-footer { background:#f0ead8; border:1px solid rgba(212,168,32,.25); border-top:none; padding:12px 18px; text-align:center; font-size:.72em; color:#888; border-radius:0 0 10px 10px; }
        #loadingBox, #errorBox { text-align:center; padding:50px 20px; }
        #loadingBox { color:#1a3a6e; font-size:1.1em; }
        .spinner { width:46px; height:46px; border:5px solid #e0d8b8; border-top-color:#d4a820; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 18px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #loadingStatus { font-size:.78em; color:#888; margin-top:8px; }
        #errorBox { color:#c0392b; background:#fff5f5; border:2px solid #e74c3c; border-radius:10px; font-size:.95em; }
        #errorBox h3 { margin:0 0 10px; }
        .badge { display:inline-block; padding:2px 10px; border-radius:20px; font-size:.78em; font-weight:bold; margin-left:6px; }
        .badge-masy { background:#28a745; color:#fff; }
        .badge-inst { background:#0d6efd; color:#fff; }
        @media (max-width:480px) { .detail-label { min-width:120px; font-size:.82em; } .detail-value { font-size:.85em; } }
    </style>
</head>
<body>
<div class="wrapper">
    <div id="loadingBox">
        <div class="spinner"></div>
        Memuat data tamu…
        <div id="loadingStatus">Menghubungkan ke server…</div>
    </div>
    <div id="errorBox" style="display:none;">
        <h3>⚠️ Data Tidak Ditemukan</h3>
        <p id="errorMsg">Link tidak valid atau data telah dihapus.</p>
    </div>
    <div id="mainContent" style="display:none;"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FB_CONFIG = {
    apiKey:            "AIzaSyACuriSEyGO1xPORV8XksrgtqIUFN-QQV8",
    authDomain:        "buku-tamu-digital-64d8f.firebaseapp.com",
    databaseURL:       "https://buku-tamu-digital-64d8f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId:         "buku-tamu-digital-64d8f",
    storageBucket:     "buku-tamu-digital-64d8f.firebasestorage.app",
    messagingSenderId: "778866088048",
    appId:             "1:778866088048:web:0d2976288b5bfcdf90bcb5"
};

function escHtml(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function row(label, value) {
    return '<div class="detail-row"><div class="detail-label">'+escHtml(label)+'</div><div class="detail-value">'+value+'</div></div>';
}
function setStatus(msg) {
    var el = document.getElementById('loadingStatus');
    if (el) el.textContent = msg;
}

function renderDetail(data) {
    var badge = data.asal === 'INSTANSI'
        ? '<span class="badge badge-inst">INSTANSI</span>'
        : '<span class="badge badge-masy">MASYARAKAT</span>';

    var asalRows = '';
    if (data.asal === 'INSTANSI') {
        asalRows = row('Instansi / Unit Kerja', escHtml(data.instansi || '-'));
    } else if (data.asal === 'MASYARAKAT') {
        asalRows  = row('Asal', 'Masyarakat');
        asalRows += row('Kecamatan', escHtml(data.kecamatan || '-'));
        asalRows += row('Desa / Kelurahan', escHtml(data.desa || '-'));
    } else {
        asalRows = row('Asal', escHtml(data.asal || '-'));
    }

    var fotoFront = data.fotoFront || data.foto || data.fotoDepan || '';
    var fotoBack  = data.fotoBack  || data.fotoBelakang || '';
    var ttd       = data.tandaTangan || '';

    var fotoHtml = '';
    if (fotoFront || fotoBack) {
        var gridHtml = '';
        if (fotoFront) gridHtml += '<div class="foto-box"><small>FOTO WAJAH</small><img src="'+fotoFront+'" alt="Foto Wajah" loading="lazy"></div>';
        if (fotoBack)  gridHtml += '<div class="foto-box"><small>FOTO SUASANA</small><img src="'+fotoBack+'" alt="Foto Suasana" loading="lazy"></div>';
        fotoHtml = '<div class="foto-grid">'+gridHtml+'</div>';
    } else {
        fotoHtml = '<div class="foto-empty">Tidak ada foto tersedia</div>';
    }

    var ttdHtml = ttd
        ? '<div class="ttd-box"><small>TANDA TANGAN</small><img src="'+ttd+'" alt="Tanda Tangan" loading="lazy"></div>'
        : '<div class="foto-empty" style="margin-top:10px;">Tidak ada tanda tangan tersedia</div>';

    var nomorHp = (data.nomorHp || '').replace(/^C\s*/, '');
    var nomorVal = nomorHp
        ? '<a href="https://wa.me/'+nomorHp.replace(/^0/,'62')+'" class="detail-value">'+escHtml(nomorHp)+'</a>'
        : '-';

    var html =
        '<div class="detail-header">' +
            '<h1>✦ BUKU TAMU DIGITAL ✦</h1>' +
            '<p>INSPEKTORAT DAERAH<br>KABUPATEN TULANG BAWANG BARAT</p>' +
            '<div class="ts">'+escHtml(data.timestamp || '')+'</div>' +
        '</div>' +
        '<div class="detail-body">' +
            row('Nama Lengkap', escHtml(data.nama || '-') + badge) +
            asalRows +
            row('Pihak yang Ditemui', escHtml(data.pihakDitemui || '-')) +
            row('Jenis Layanan', escHtml(data.jenisLayanan || '-')) +
            row('Uraian Keperluan', escHtml(data.uraian || '-')) +
            row('Nomor WhatsApp', nomorVal) +
            row('Waktu Kunjungan', escHtml(data.timestamp || '-')) +
        '</div>' +
        '<div class="foto-header">DOKUMENTASI FOTO &amp; TANDA TANGAN</div>' +
        '<div class="foto-body">' + fotoHtml + ttdHtml + '</div>' +
        '<div class="detail-footer">Dokumen ini dibuat otomatis oleh Sistem Buku Tamu Digital — Inspektorat Kab. Tulang Bawang Barat</div>';

    document.getElementById('loadingBox').style.display = 'none';
    var mc = document.getElementById('mainContent');
    mc.innerHTML = html;
    mc.style.display = 'block';
}

function tampilError(msg) {
    document.getElementById('loadingBox').style.display = 'none';
    document.getElementById('errorMsg').textContent = msg || 'Data tidak ditemukan.';
    document.getElementById('errorBox').style.display = 'block';
}

async function muatDariFirebase(fbKey) {
    setStatus('Menghubungkan ke database…');
    try {
        if (!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
        var db = firebase.database();

        // 1. Coba dataFinal
        setStatus('Mencari data…');
        var snap = await db.ref('bukuTamu/dataFinal/' + fbKey).get();
        if (snap.exists()) { renderDetail(snap.val()); return; }

        // 2. Coba dataSementara (jika pindah ke final gagal, key lama masih valid)
        snap = await db.ref('bukuTamu/dataSementara/' + fbKey).get();
        if (snap.exists()) { renderDetail(snap.val()); return; }

        tampilError('Data tidak ditemukan di server. Link mungkin sudah tidak valid.');
    } catch(e) {
        console.error('Firebase error:', e);
        tampilError('Gagal memuat dari server: ' + e.message);
    }
}

function muatDariBase64(encoded) {
    try {
        setStatus('Membaca data dari link…');
        var json = decodeURIComponent(escape(atob(encoded)));
        var data = JSON.parse(json);
        renderDetail(data);
    } catch(e) {
        tampilError('Format link tidak valid atau data rusak.');
    }
}

(function init() {
    var params = new URLSearchParams(window.location.search);
    var fbKey  = params.get('key');
    var tamu   = params.get('tamu');

    if (fbKey) {
        muatDariFirebase(decodeURIComponent(fbKey));
    } else if (tamu) {
        muatDariBase64(tamu);
    } else {
        tampilError('Tidak ada parameter di URL. Pastikan link yang dibuka sudah benar.');
    }
})();
</script>
</body>
</html>
