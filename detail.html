<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Detail Tamu — Buku Tamu Digital Inspektorat Tubaba</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e8f4fd; margin: 0; padding: 0; }

        body::before {
            content: ''; position: fixed; inset: 0;
            border: 10px solid transparent;
            border-image: linear-gradient(135deg,#f5e07a 0%,#d4a820 20%,#a07810 40%,#f5e07a 55%,#d4a820 70%,#c8960e 85%,#f5e07a 100%) 1;
            box-shadow: inset 0 0 18px 4px rgba(212,168,32,.55), inset 0 0 6px 1px rgba(0,0,0,.55), 0 0 22px 6px rgba(212,168,32,.30);
            pointer-events: none; z-index: 99999;
        }
        body::after {
            content: ''; position: fixed; inset: 16px;
            border: 1.5px solid rgba(212,168,32,.40);
            pointer-events: none; z-index: 99998;
        }

        .wrapper { max-width: 680px; margin: 28px auto 48px; padding: 0 18px; }

        .card-header {
            background: linear-gradient(135deg,#0d1f45 0%,#1a3a6e 60%,#0d1f45 100%);
            color: #f5e07a; padding: 20px 20px 16px; text-align: center;
            border-radius: 12px 12px 0 0;
        }

        .card-body {
            background: #fff;
            border: 1px solid rgba(212,168,32,.22);
            border-top: none;
        }

        .info-row {
            display: flex;
            align-items: flex-start;
            padding: 11px 16px;
            border-bottom: 1px solid #f2ece0;
            gap: 10px;
        }

        .card-footer {
            background: #f0ead8;
            border: 1px solid rgba(212,168,32,.22);
            border-top: none;
            padding: 11px 16px;
            text-align: center;
            font-size: .70em;
            color: #888;
            border-radius: 0 0 12px 12px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div id="mainContent"></div>

<script>
function renderDetail() {

    var html =
        '<div class="card-header">'
            + '<h1>✦ BUKU TAMU DIGITAL ✦</h1>'
        + '</div>'

        + '<div class="card-body">'
            + '<div class="info-row">Contoh isi data</div>'
        + '</div>'

        /* FOOTER SUDAH DIPERBAIKI */
        + '<div class="card-footer">'
            + 'Dokumen ini dibuat otomatis oleh Sistem Buku Tamu Digital<br>'
            + '<strong>Inspektorat Kab. Tulang Bawang Barat</strong>'
        + '</div>';

    document.getElementById('mainContent').innerHTML = html;
}

renderDetail();
</script>

</body>
</html>
